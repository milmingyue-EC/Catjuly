            text-align: center;

        h1 {

            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .search-container {

            margin: 0 auto 25px auto;
        }

            border: 3px solid #bc00dd; 
            border-radius: 30px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            background-color: #fffbfe;
        }
        .search-container input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            background-color: #ffffff;
        }
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }
        .category-btn {
            background-color: #ffffff;
            color: #bc00dd;
            border: 2px solid #bc00dd;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
        }
        .category-btn.active, .category-btn:hover {
            background: linear-gradient(90deg, #ff007f 0%, #bc00dd 100%);
            color: #ffffff;
            border-color: #ff007f;
            box-shadow: 0 4px 10px rgba(255, 0, 127, 0.3);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            border: 2px solid #fff0f6;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-8px);
            border-color: #ff007f;
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.2);
        }
        .product-img-wrapper {
            width: 100%;
            height: 190px;
            background-color: #faf0f5;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-img {
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;
            transition: transform 0.3s ease;
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }
        .product-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333;
            margin: 5px 0;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ff007f;
            margin: 8px 0;
        }
        .details-btn {
            background: linear-gradient(90deg, #bc00dd 0%, #ff007f 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px; 
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 3px 8px rgba(188, 0, 221, 0.2);
        }
        .details-btn:hover {
            background: linear-gradient(90deg, #ff007f 0%, #bc00dd 100%);
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.4);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 0, 20, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #ffffff;
            width: 92%;
            max-width: 550px;
            border-radius: 20px;
            padding: 30px 25px 25px 25px;
            position: relative;
            box-shadow: 0 10px 40px rgba(255, 0, 127, 0.3);
            text-align: center;
            border: 3px solid #ff007f;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-modal {
            position: absolute;
            top: 12px; right: 15px;
            font-size: 32px; font-weight: 900;
            color: #ff007f; border: none; background: none;
            cursor: pointer; z-index: 10;
            transition: transform 0.2s;
        }
        .close-modal:hover { transform: scale(1.15); }
        .modal-slider {
            position: relative;
            width: 100%;
            height: 300px;
            background: #fff9fc;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #ffe6f2;
        }
        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .modal-img-container {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff9fc;
        }
        .modal-img {
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: contain; 
            background-repeat: no-repeat;
        }
        .slider-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #ff007f;
            color: #ff007f; 
            font-size: 1.8rem; font-weight: bold;
            cursor: pointer; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            user-select: none; border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 10px rgba(255,0,127,0.2);
            transition: all 0.2s;
        }
        .slider-arrow:hover { 
            background: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 12px #ff007f;
        }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }
        .modal-title { font-size: 1.5rem; color: #111; margin: 10px 0; font-weight: 700; }
        .modal-price { font-size: 1.7rem; color: #ff007f; font-weight: 800; margin: 5px 0; }
        .modal-desc { font-size: 1rem; color: #444; margin: 15px 0; line-height: 1.6; text-align: left; background: #fff5fa; padding: 15px; border-radius: 12px; border-left: 4px solid #bc00dd; max-height: 180px; overflow-y: auto;}
        .whatsapp-btn-modal {
            background-color: #25D366;
            color: white; border: none;

        .whatsapp-floating {

            { id: 71, name: "Vibrador Cola de Sirena Recargable", price: "$35.99", category: "Vibradores", images: ["https://i.ibb.co/QFdymCVD/image.png", "https://i.ibb.co/PZH7FDmp/image.png", "https://i.ibb.co/vvmxy0GV/image.png", "https://i.ibb.co/9mkvsPHJ/image.png", "https://i.ibb.co/GQ43CvXS/image.png", "https://i.ibb.co/Txc7qj3d/image.png", "https://i.ibb.co/ZzfkT9x7/image.png", "https://i.ibb.co/Xnv8ckF/image.png"], desc: "Silencioso juguete en forma de pescadito diseñado para explorar 10 modalidades de vibración. Hecho de silicona premium, totalmente impermeable y recargable con control remoto a distancia." }
        ];

        let currentCategory = "Todos";
        let activeProduct = null;
        let activeImgIndex = 0;

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";

            const filtered = PRODUCTS.filter(p => {
                const matchesCategory = (currentCategory === "Todos" || p.category === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "product-card";
                card.innerHTML = `
                    <div>
                        <div class="product-img-wrapper" onclick="openProduct(${p.id})">
                            <div class="product-img" style="background-image: url('${p.images[0]}')"></div>
                        </div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price}</div>
                    </div>
                    <button class="details-btn" onclick="openProduct(${p.id})">Ver detalles</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            renderProducts();
        }

        function selectCategory(cat) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if(btn.textContent === cat) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderProducts();
        }

        function openProduct(id) {
            activeProduct = PRODUCTS.find(p => p.id === id);
            if (!activeProduct) return;
            
            activeImgIndex = 0;
            document.getElementById('modalTitle').textContent = activeProduct.name;
            document.getElementById('modalPrice').textContent = activeProduct.price;
            document.getElementById('modalDesc').textContent = activeProduct.desc;
            
            const track = document.getElementById('sliderTrack');
            track.innerHTML = "";
            activeProduct.images.forEach(imgUrl => {
                const container = document.createElement('div');
                container.className = "modal-img-container";
                container.innerHTML = `<div class="modal-img" style="background-image: url('${imgUrl}')"></div>`;
                track.appendChild(container);
            });

            const encodedMsg = encodeURIComponent("Hola, quiero información del producto: " + activeProduct.name);
            document.getElementById('whatsappModalLink').href = "https://wa.me/593969999363?text=" + encodedMsg;
            
            updateSliderPosition();
            toggleModal(true);
        }

        function updateSliderPosition() {
            const track = document.getElementById('sliderTrack');
            track.style.transform = `translateX(-${activeImgIndex * 100}%)`;
        }

        function changeImage(direction) {
            if (!activeProduct) return;
            activeImgIndex += direction;
            if (activeImgIndex >= activeProduct.images.length) activeImgIndex = 0;
            if (activeImgIndex < 0) activeImgIndex = activeProduct.images.length - 1;
            updateSliderPosition();
        }

        function toggleModal(show) {
            document.getElementById('productModal').style.display = show ? 'flex' : 'none';
        }

        function closeModal(e) {
            if (e.target.id === 'productModal') toggleModal(false);
        }

        renderProducts();
    </script>
</body>
